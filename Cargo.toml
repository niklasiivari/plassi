[workspace]
members = [".", "typeset"]

[package]
name = "plassi"
version = "0.1.0"
edition = "2024"
description = "Seating planner for events: import sign-ups, seat guests by their wishes, print place lists."
authors = ["Niklas Iivari <plassi@niklasiivari.fi>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/niklasiivari/plassi"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
calamine = "0.36.1"
csv = "1.4"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.9"
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.100.0", features = ["wasm"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1.1.0"
zip = { version = "8.6.0", default-features = false }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
plassi-typeset = { path = "typeset" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "8"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Navigator", "Storage", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlCanvasElement", "Element", "console", "HtmlInputElement", "FileList", "File", "StorageManager", "HtmlElement", "DomTokenList", "Event", "EventTarget"] }

[profile.dev]
opt-level = 1

# Compact browser profile, also used for the large typesetter module.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Dependencies in the browser build are optimised for size too.
[profile.web.package."*"]
opt-level = "z"

# Default throughput profile for the app/solver. The much larger typesetter
# keeps the compact profile; select PLASSI_WEB_PROFILE=web for a smaller app.
[profile.web-speed]
inherits = "web"
opt-level = 3

[profile.web-speed.package.rand]
opt-level = 3

[profile.web-speed.package.rand_core]
opt-level = 3

[profile.web-speed.package.rand_chacha]
opt-level = 3

[profile.web-speed.package.ppv-lite86]
opt-level = 3

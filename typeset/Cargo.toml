[package]
name = "plassi-typeset"
version = "0.1.0"
edition = "2024"
description = "Plassi's A4 prints: JSON data in, PDF out, typeset with Typst."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
typst-as-lib = "0.16"
typst-pdf = "0.15.1"
typst = "0.15"
typst-layout = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
